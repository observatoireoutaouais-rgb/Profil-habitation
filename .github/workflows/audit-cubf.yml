name: Audit CUBF (temporaire)

on:
  push:
    branches: [ claude/1010-rl0105a-6hcidb ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests openpyxl
      - run: python tools/audit_cubf.py 2026 2023
